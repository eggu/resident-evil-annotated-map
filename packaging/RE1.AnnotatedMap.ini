; RE1 Annotated Map - Survivor's Notes
; Install beside the plugin in <game folder>/scripts/ (scripts/RE1.AnnotatedMap.asi).
; Close the game before editing, save this file, then restart the game.
; When upgrading, keep your existing INI instead of replacing it with this file.
; Settings changed in game are saved here automatically.

[Keys]
; Keyboard key to open/close the full-screen map. Default: TAB.
; Use one letter/number, ESC, TAB, SPACE, BACKSPACE, F1-F12,
; a virtual-key code such as 0x4D, or NONE to disable the keyboard shortcut.
OpenKey=TAB
; Controller button to open/close the full-screen map. Default: START (Menu / Options).
; Classic REbirth uses BACK for its settings screen by default.
; If START is bound to a game action, choose another unused button, e.g. OpenPad=LS.
; LS/RS mean clicking the left/right stick; START is Menu/Options on many pads.
; Accepted XInput buttons: A B X Y LB RB START BACK LS RS UP DOWN LEFT RIGHT.
; LT/RT triggers and button combinations are not supported.
; OpenPad=NONE disables the controller shortcut; the keyboard key still works.
; This binding is independent of the game's controller configuration.
OpenPad=START
; Additional keyboard key to close the map. Same key names as OpenKey.
CloseKey=ESC
; 1: also close with the game's cancel action; 0: disable that action.
CloseOnCancel=1
; Key held with minus/plus or [ / ] to change icons instead of names: SHIFT (default) or CTRL.
Modifier=SHIFT
; Debug capture: writes RE1.AnnotatedMap.capture.txt (map state and progress flags) beside this file.
; Same key names as OpenKey; NONE disables it. Default: F12.
CaptureKey=F12

[AnnotatedMap]
; Display mode, chosen once when the game starts: Auto = SD when Classic REbirth's HD textures are off (config.ini [DLL] HDLoader=0 or
; missing, or RetroMode=1), otherwise HD; HD or SD force one. SD draws 1x pixel markers and pixel-font room names; name/icon size and
; opacity, item names and HD icons do not apply in SD.
DisplayMode=Auto
; The zoom level is not stored: the map always opens at 1x (older versions wrote Zoom=; it is ignored and removed on save).
; 1 = HD-style item/key/document/puzzle icons on the full map (the status-screen map always keeps the pixel icons), 0 = pixel icons everywhere.
HdIcons=1
; Texture uploads per frame when the map opens or changes (1-200). Lower = smoother frames, higher = everything appears sooner.
UploadBudget=12
; 1 = on, 0 = off. All is the master switch; keep it on to show Rooms.
All=1
Rooms=1
Locks=0
KeyItems=0
Documents=0
Puzzles=0
Events=0
CommonItems=0
Enemies=0
; In-game keys: 0 all, 1 rooms, 2 locks, 3 key items, 4 files and maps, 5 puzzles, 6 events (story scenes, spoilers),
; 7 common items, 8 enemies.
; en = English, ko = Korean. In-game key: \ (backslash; Korean keyboards show it as the won sign).
Language=en
; 1 = visited rooms, 2 = revealed by a floor map, 3 = all rooms (spoilers).
; In-game key: 9.
Scope=1
; Name size: 50-150, in steps of 10. 100 is the original size.
; In-game keys: minus/plus (main keyboard or numpad).
NameSize=100
; Name opacity: 10-100, in steps of 10.
; In-game keys: [ / ].
NameOpacity=70
; Item names (key items, puzzles, keys, files, items) on the full-screen map; room names use key 1.
; 0 = off, 1 = all names, 2 = all except common items (same meaning as the RE1 HD / RE2 / RE3 map mods).
; In-game key: H cycles all -> all except common -> off. Versions 1-2 used 0 = off / 1 = on (unchanged);
; the short-lived version 3 (0 all / 1 no common / 2 off) is converted once when the file is loaded.
ItemNames=0
; Icon size: 50-200, in steps of 10. In-game keys: Shift (see Modifier) + minus/plus.
IconSize=100
; Icon opacity: 10-100, in steps of 10. In-game keys: Shift (see Modifier) + [ / ].
IconOpacity=80
; 1 = legend shown, 0 = folded to one line. In-game key: ~ (the key left of 1).
Legend=1
; Locked-door keys: 0 = on the door, 1 = beside the door, in the room not visited yet.
KeySide=0
; Tint rooms with remaining items when the relevant item category is enabled.
RoomTint=1
; Settings format version. Do not edit. Version 5 renumbered the in-game keys (the values above are stored by name, so nothing is converted).
Version=5

[Colors]
; Legend, name and badge colour of each category, #RRGGBB. Delete a line (or leave it as is) to use the default.
; Colours are shown with 5 bits per channel, so a value may be off by up to 4/255. Pure black is not available (the game treats it as transparent).
; Close the game before editing. Settings saved in game keep this section and its comments.
Rooms=#F0E2BE
Locks=#FFCD46
KeyItems=#5ADCFF
Files=#FF8CD2
Puzzles=#FF9628
Events=#B070FF
CommonItems=#B8BCC4
Enemies=#DC3C32

[Calibration]
; Advanced status-screen position/depth and player-arrow correction.
; Leave these defaults unless correcting a display alignment issue.
OffsetX=0
OffsetY=0
Z=16
ArrowRotation=0
